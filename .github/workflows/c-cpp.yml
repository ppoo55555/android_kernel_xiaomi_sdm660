name: Build NAT Modules

on:
  push:
    paths:
      - 'kernel/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-nat-modules:
    runs-on: ubuntu-latest
    env:
      # 交叉编译配置
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      # defconfig 名称
      DEFCONFIG: clover_defconfig
      # 内核源码相对路径（工作区根目录下）
      KERNEL_SRC: ${{ github.workspace }}/kernel/android_kernel_xiaomi_sdm660

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install cross-compile toolchain & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev

      - name: Generate defconfig
        working-directory: ${{ env.KERNEL_SRC }}
        run: |
          # 复制 arch/arm64/configs/clover_defconfig 到 .config
          make ${{ env.DEFCONFIG }}

      - name: Enable Netfilter & NAT in .config
        working-directory: ${{ env.KERNEL_SRC }}
        run: |
          chmod +x scripts/config
          scripts/config --enable CONFIG_NETFILTER
          scripts/config --enable CONFIG_NF_CONNTRACK
          scripts/config --enable CONFIG_NF_CONNTRACK_IPV4
          scripts/config --enable CONFIG_NF_CONNTRACK_IPV6
          scripts/config --enable CONFIG_NF_NAT
          scripts/config --enable CONFIG_NF_NAT_IPV4
          scripts/config --enable CONFIG_NF_NAT_IPV6
          scripts/config --enable CONFIG_IP_NF_TARGET_REDIRECT
          scripts/config --enable CONFIG_IP_NF_TARGET_MASQUERADE

      - name: Refresh config (olddefconfig)
        working-directory: ${{ env.KERNEL_SRC }}
        run: |
          make olddefconfig

      - name: Prepare for module build
        working-directory: ${{ env.KERNEL_SRC }}
        run: |
          make modules_prepare

      - name: Build Netfilter modules
        working-directory: ${{ env.KERNEL_SRC }}
        run: |
          make -j$(nproc) M=net/ipv4/netfilter modules
          make -j$(nproc) M=net/netfilter modules

      - name: Collect built .ko files
        working-directory: ${{ env.KERNEL_SRC }}
        run: |
          mkdir -p ${{ github.workspace }}/modules
          cp net/ipv4/netfilter/*.ko ${{ github.workspace }}/modules/
          cp net/netfilter/*.ko       ${{ github.workspace }}/modules/

      - name: Upload NAT modules artifact
        uses: actions/upload-artifact@v4
        with:
          name: ua_nat_modules
          path: modules
