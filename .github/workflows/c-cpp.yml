name: Build NAT Modules

on:
  workflow_dispatch:

jobs:
  build-nat-modules:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      DEFCONFIG: clover_defconfig

    steps:
    - uses: actions/checkout@v3

    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
          bc bison flex libssl-dev libelf-dev

    - name: Generate defconfig
      working-directory: ${{ github.workspace }}
      run: make ${{ env.DEFCONFIG }}

    - name: Enable Netfilter & NAT
      working-directory: ${{ github.workspace }}
      run: |
        chmod +x scripts/config
        scripts/config --enable CONFIG_NETFILTER
        # … 其余 scripts/config …

    - name: Refresh config (olddefconfig)
      working-directory: ${{ github.workspace }}
      run: make olddefconfig

    - name: Prepare modules
      working-directory: ${{ github.workspace }}
      run: make modules_prepare

    - name: Build Netfilter modules
      working-directory: ${{ github.workspace }}
      run: |
        make -j$(nproc) M=net/ipv4/netfilter modules
        make -j$(nproc) M=net/netfilter       modules

    - name: Upload modules
      uses: actions/upload-artifact@v4
      with:
        name: ua_nat_modules
        path: modules
