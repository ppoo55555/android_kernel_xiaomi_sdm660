name: Android Kernel CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev \
          libelf-dev dwarves python3

    - name: Download toolchain
      run: |
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=$PWD/toolchain/bin/aarch64-linux-android-
        make O=out defconfig
        make -j$(nproc) O=out

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: out/arch/arm64/boot/Image.gz
